name: investplanner

services:
  aktools:
    build:
      context: .
      dockerfile: deploy/aktools.Dockerfile
      args:
        AKTOOLS_VERSION: 0.0.91
        AKSHARE_VERSION: 1.18.64
    image: invest-planner-aktools:0.0.91-akshare-1.18.64
    restart: unless-stopped
    networks:
      - backend
      - egress

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-invest_planner}
      MYSQL_USER: ${MYSQL_USER:-invest_planner}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

  api:
    image: ${API_IMAGE:-invest-planner-api:local}
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      MYSQL_DSN: ${MYSQL_USER:-invest_planner}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@tcp(mysql:3306)/${MYSQL_DATABASE:-invest_planner}?charset=utf8mb4&parseTime=True&loc=Local
      WEB_ORIGIN: ${APP_URL:?set APP_URL in .env, for example http://192.168.1.10:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      SESSION_TTL: ${SESSION_TTL:-1h}
      AKTOOLS_BASE_URL: http://aktools:8080
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      MARKET_DATA_PRODUCTION_APPROVED: ${MARKET_DATA_PRODUCTION_APPROVED:-false}
      FX_ASSISTANT_ENABLED: ${FX_ASSISTANT_ENABLED:-true}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      mysql:
        condition: service_healthy
      aktools:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend
      - frontend
      - egress

  web:
    image: ${WEB_IMAGE:-invest-planner-web:local}
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - ${APP_PORT:-3000}:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - frontend

networks:
  backend:
    internal: true
  frontend:
  egress:

volumes:
  mysql-data:
    name: investplanner-mysql-data
