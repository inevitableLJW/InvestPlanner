services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-invest_planner}
      MYSQL_USER: ${MYSQL_USER:-invest_planner}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-invest_planner}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-password}
    ports:
      - "3306:3306"
    volumes:
      - invest-planner-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  invest-planner-mysql:
