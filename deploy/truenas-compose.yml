# TrueNAS SCALE 25.10: Apps > Discover Apps > menu > Install via YAML.
name: invest-planner

# Edit values only in this block. References below reuse them automatically.
x-invest-planner-settings:
  mysql-data-dir: &mysql_data_dir /mnt/REPLACE_WITH_POOL/apps/invest-planner/mysql
  mysql-password: &mysql_password REPLACE_WITH_A_LONG_RANDOM_PASSWORD
  web-port: &web_port 3000

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: invest_planner
      MYSQL_USER: invest_planner
      MYSQL_PASSWORD: *mysql_password
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: *mysql_data_dir
        target: /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

  api:
    image: ghcr.io/inevitableljw/invest-planner-api:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: invest_planner
      MYSQL_USER: invest_planner
      MYSQL_PASSWORD: *mysql_password
      COOKIE_SECURE: "false"
      SESSION_TTL: 168h
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend
      - frontend

  web:
    image: ghcr.io/inevitableljw/invest-planner-web:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - target: 8080
        published: *web_port
        protocol: tcp
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - frontend

networks:
  backend:
    internal: true
  frontend:

# TrueNAS replaces 0.0.0.0 with the selected node IP when rendering the portal.
x-portals:
  - name: Web UI
    scheme: http
    host: 0.0.0.0
    port: *web_port
    path: /
