# TrueNAS SCALE 25.10: Apps > Discover Apps > menu > Install via YAML.
# Before saving, replace all three REPLACE_* values below.
name: invest-planner

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: invest_planner
      MYSQL_USER: invest_planner
      MYSQL_PASSWORD: REPLACE_WITH_A_LONG_RANDOM_PASSWORD
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      TZ: Asia/Shanghai
    volumes:
      - /mnt/REPLACE_WITH_POOL/apps/invest-planner/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

  api:
    image: ghcr.io/inevitableljw/invest-planner-api:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      MYSQL_DSN: invest_planner:REPLACE_WITH_A_LONG_RANDOM_PASSWORD@tcp(mysql:3306)/invest_planner?charset=utf8mb4&parseTime=True&loc=Local
      WEB_ORIGIN: http://REPLACE_WITH_TRUENAS_IP:3000
      COOKIE_SECURE: "false"
      SESSION_TTL: 168h
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend
      - frontend

  web:
    image: ghcr.io/inevitableljw/invest-planner-web:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - frontend

networks:
  backend:
    internal: true
  frontend:
